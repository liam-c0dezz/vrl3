<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2E5A">
<title>EasyBid</title>
<style>
:root{
  --dark:#0B2E5A;--light:#347FE5;--accent:#1D5297;--ink:#141419;--item:#4D4D54;--secondary:#8E8E93;--muted:#AEAEB2;--border:#C7C7CC;--green:#1E7B34;--red:#B42318;
  --rounded:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.4 var(--sf);color:var(--ink);background:linear-gradient(160deg,#DCE8F8 0%,#F2F6FC 38%,#EEF3FA 70%,#F7F9FC 100%) fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #7FB0F5;outline-offset:2px}
.page{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}

/* glass surfaces */
.glass{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 18px 40px -24px rgba(11,46,90,.38)}
.card{border-radius:24px;padding:20px}
.press{transition:transform .3s cubic-bezier(.3,1.7,.45,1)}
.press:active{transform:scale(.96);transition-duration:.08s}
.rise{animation:rise .6s ease-out backwards}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(150deg,#347FE5,#0B2E5A);box-shadow:0 8px 18px -10px rgba(11,46,90,.6)}
.top h1{flex:1;margin:0;font:700 30px/1.1 var(--sf);letter-spacing:-.3px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

/* wallet card */
.wbal{position:relative;border-radius:30px;padding:22px;color:#fff;overflow:hidden;background:linear-gradient(150deg,#0B2E5A 0%,#14427F 45%,#2262B5 78%,#347FE5 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 26px 44px -22px rgba(11,46,90,.7)}
.wbal::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%);pointer-events:none}
.wbal>*{position:relative;z-index:1}
.wbal .hd{display:flex;justify-content:space-between;align-items:center;font:500 14px var(--rounded);color:rgba(255,255,255,.82)}
.pill{font:600 12px var(--rounded);padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.amt{font:600 46px/1.1 var(--rounded);letter-spacing:-.5px;margin-top:14px;font-variant-numeric:tabular-nums}
.chg{font:600 12.5px var(--rounded);margin-top:6px;min-height:17px}
.chg.up{color:#B9F5CF}.chg.down{color:#FFC9C4}
.stats{display:flex;gap:10px;margin-top:22px}
.st{flex:1;min-width:0;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 1px rgba(255,255,255,.22)}
.st span{display:block;font:500 11px var(--rounded);color:rgba(255,255,255,.75)}
.st b{display:block;font:600 15px var(--rounded);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* actions */
.acts{display:flex;margin:22px 0 4px}
.acts button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 12.5px var(--rounded);color:var(--ink)}
.orb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.acts button:active .orb{transform:scale(.88)}
.orb{transition:transform .3s cubic-bezier(.3,1.8,.45,1)}

section{margin-top:22px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sh h2{margin:0;font:600 17px var(--rounded)}
.sh span{font:500 12px var(--rounded);color:var(--secondary)}

/* chart */
.leg{display:flex;gap:24px;margin:2px 0 8px}
.leg span{display:flex;align-items:center;gap:6px;font:500 12px var(--rounded);color:var(--secondary)}
.leg i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.leg div+div i{background:rgba(52,127,229,.55)}
.leg b{display:block;font:600 19px var(--rounded);margin-top:3px;font-variant-numeric:tabular-nums}
.chart{position:relative;height:170px}
.chart svg{position:absolute;left:0;right:0;top:0;width:100%;height:148px;overflow:visible}
.chart .line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mo{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font:500 11px var(--rounded);color:var(--secondary)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.row+.row{border-top:.7px solid rgba(11,46,90,.08)}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--accent);background:rgba(52,127,229,.12)}
.ic.in{color:var(--green);background:rgba(52,199,89,.15)}
.nm{flex:1;min-width:0}
.nm b{display:block;font:600 15px var(--rounded);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font:400 12.5px var(--rounded);color:var(--secondary)}
.v{font:600 15px var(--rounded);white-space:nowrap;font-variant-numeric:tabular-nums}
.v.in{color:var(--green)}
.tag{font:600 11px var(--rounded);padding:3px 8px;border-radius:7px;background:rgba(52,127,229,.12);color:var(--accent);margin-left:6px}
.empty{text-align:center;padding:18px 6px;color:var(--secondary);font:400 14px var(--rounded)}
.empty b{display:block;color:var(--ink);font:600 15px var(--rounded);margin-bottom:4px}

/* buttons & fields */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:999px;font:600 16px var(--rounded);color:#fff;background:linear-gradient(rgb(54,56,69),var(--ink));box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 12px 22px -12px rgba(20,20,25,.45)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.blue{background:linear-gradient(135deg,var(--accent),var(--light))}
.link{color:var(--accent);font:600 14px var(--rounded)}
label.f{display:block;margin-top:14px;font:600 13px var(--rounded);color:var(--item)}
.field{width:100%;margin-top:6px;padding:13px 14px;border-radius:14px;border:1px solid rgba(11,46,90,.12);background:rgba(255,255,255,.75);font:400 16px var(--rounded);outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--light);box-shadow:0 0 0 4px rgba(52,127,229,.15)}
textarea.field{min-height:130px;resize:vertical;line-height:1.45}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(11,46,90,.07);margin-top:8px}
.seg button{flex:1;padding:9px;border-radius:10px;font:600 13px var(--rounded);color:var(--item)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(11,46,90,.12)}
.err{margin-top:12px;color:var(--red);font:500 13.5px var(--rounded)}
.note{margin-top:10px;color:var(--secondary);font:400 12.5px/1.45 var(--rounded)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:14px;background:rgba(52,127,229,.08);font:400 13.5px/1.45 var(--rounded);color:var(--item)}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}

/* sign in */
.auth{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.auth h1{font:700 30px/1.15 var(--sf);margin:18px 0 6px}
.auth p{margin:0;color:var(--item);font:400 15px var(--rounded)}

/* sheets */
.dim{position:fixed;inset:0;background:rgba(11,20,35,.32);z-index:20;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;background:rgba(250,252,255,.96);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 -20px 50px -20px rgba(11,46,90,.4);animation:up .38s cubic-bezier(.2,.9,.25,1)}
@media (min-width:640px){.sheet{left:50%;width:520px;margin-left:-260px;bottom:auto;top:6dvh;border-radius:28px;max-height:88dvh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .in-sheet{padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
.grab{width:36px;height:5px;border-radius:3px;background:#C7C7CC;margin:8px auto 4px}
.sheet h3{margin:6px 0 2px;font:700 22px var(--sf)}
.sheet .x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(11,46,90,.07);display:grid;place-items:center}
.cat{margin-top:16px;font:600 13px var(--rounded);color:var(--secondary);text-transform:uppercase;letter-spacing:.4px}
.item{display:flex;gap:10px;padding:10px 0;border-top:.7px solid rgba(11,46,90,.08);font:400 14px var(--rounded)}
.item .q{color:var(--secondary);font-size:12.5px}
.item b{margin-left:auto;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.totals{margin-top:14px;padding:14px;border-radius:16px;background:rgba(52,127,229,.08)}
.totals div{display:flex;justify-content:space-between;font:500 14px var(--rounded);padding:3px 0;color:var(--item)}
.totals div.t{font:700 18px var(--rounded);color:var(--ink);padding-top:8px}
.spin{width:64px;height:64px;margin:26px auto 14px;border-radius:50%;border:5px solid rgba(52,127,229,.18);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.photo{margin-top:8px;display:flex;align-items:center;gap:10px}
.photo img{width:58px;height:58px;object-fit:cover;border-radius:12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.chart .line{stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="page" id="app" aria-live="polite"></main>
<script>/*SUPABASE_JS*/</script>
<script>
"use strict";
/* ===== Connection: the same project and public (publishable) key as the iOS app.
   This key is meant to be public; every row is protected by Supabase row-level security,
   so a signed-in user only ever sees their own organization's data. ===== */
const SUPABASE_URL = "https://tuykoxmpnmrawrknjikr.supabase.co";
const SUPABASE_KEY = "sb_publishable_mYhHJdb0mfCTvUWdGAWrpg_jmbY9GV-";
const ESTIMATOR_URL = SUPABASE_URL + "/functions/v1/smart-service-v7";
const AI_CONSENT_VERSION = "2026-07-31";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const app = document.getElementById("app");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const State = { session: null, org: null, projects: [], estimates: [], invoices: [], payments: [], clients: [], loading: false, error: "" };

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2, maximumFractionDigits: 2 });
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (Number(c) ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (Number(c) / 4)))).toString(16));
const is = (row, status) => String(row.status || "").toLowerCase() === status;
const monthKey = d => d.getFullYear() * 12 + d.getMonth();
const shortDate = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const ICON = {
  house: '<path d="M4.6 20.4V10.2L12 5l7.4 5.2v10.2Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>',
  doc: '<path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="currentColor"/><path d="M14 3v5h5" fill="none" stroke="#fff" stroke-width="1.4" opacity=".6"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4.2l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" fill="currentColor"/><path d="M12 10.5v5M9.5 13h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  out: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l4-4-4-4M14 12H4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
  down: '<path d="M17 7 7 17M15 17H7V9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
  plane: '<path d="M3.4 11.2 19.6 4.1c.8-.3 1.6.5 1.3 1.3l-7.1 16.2c-.4.8-1.5.7-1.7-.1l-1.6-6.1-6.1-1.6c-.8-.2-.9-1.3-.1-1.7z" fill="currentColor"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
  x: '<path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
  est: '<path d="M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
};
const svg = (name, size = 20) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;

/* ---------- data ---------- */
async function loadAll() {
  State.loading = true; State.error = ""; render();
  try {
    const uid = State.session.user.id;
    const { data: mem, error: memErr } = await db.from("organization_members").select("organization_id").eq("user_id", uid).limit(1);
    if (memErr) throw memErr;
    State.org = mem?.[0]?.organization_id || null;
    const [p, e, i, ii, pay, c] = await Promise.all([
      db.from("projects").select("id,title,project_number,status,address,created_at").order("created_at", { ascending: false }),
      db.from("estimates").select("id,project_id,title,estimate_number,total,status,created_at").order("created_at", { ascending: false }),
      db.from("invoices").select("id,project_id,client_id,invoice_number,title,status,discount_amount,tax_percent,created_at,due_at").order("created_at", { ascending: false }),
      db.from("invoice_items").select("invoice_id,quantity,unit_price"),
      db.from("payments").select("id,project_id,invoice_id,amount,received_at"),
      db.from("clients").select("id,name"),
    ]);
    for (const r of [p, e, i, ii, pay, c]) if (r.error) throw r.error;
    const sums = {};
    for (const it of ii.data) sums[it.invoice_id] = (sums[it.invoice_id] || 0) + (Number(it.quantity) || 0) * (Number(it.unit_price) || 0);
    State.projects = p.data; State.estimates = e.data; State.payments = pay.data; State.clients = c.data;
    State.invoices = i.data.map(inv => {
      const sub = sums[inv.id] || 0, disc = Number(inv.discount_amount) || 0;
      return { ...inv, total: (sub - disc) * (1 + (Number(inv.tax_percent) || 0) / 100) };
    });
  } catch (err) {
    State.error = "Your data couldn't be loaded. Check your connection and try again.";
    console.error(err);
  }
  State.loading = false; render();
}

/* Same figures as WalletFigures in the app. */
function figures() {
  const now = new Date(), thisM = monthKey(now);
  let coll = State.payments.map(x => [new Date(x.received_at), Number(x.amount) || 0]);
  if (!coll.length) coll = State.invoices.filter(x => is(x, "paid")).map(x => [new Date(x.created_at), x.total]);
  const billed = State.invoices.filter(x => !is(x, "draft")).map(x => [new Date(x.created_at), x.total]);
  const sumIn = (arr, m) => arr.filter(([d]) => monthKey(d) === m).reduce((s, [, v]) => s + v, 0);
  const months = Array.from({ length: 6 }, (_, k) => thisM - 5 + k);
  const open = State.invoices.filter(x => !is(x, "paid") && !is(x, "draft"));
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const closed = new Set(["accepted", "approved", "won", "declined", "rejected", "lost"]);
  const projectName = id => State.projects.find(x => x.id === id)?.title;
  const clientName = inv => State.clients.find(x => x.id === inv.client_id)?.name || inv.title || projectName(inv.project_id) || "Invoice " + inv.invoice_number;
  const activity = [
    ...State.payments.map(x => ({ kind: "payment", title: projectName(x.project_id) || "Payment received", date: new Date(x.received_at), amount: Number(x.amount) || 0 })),
    ...State.invoices.map(x => ({ kind: is(x, "paid") ? "paid" : is(x, "draft") ? "draft" : "sent", title: clientName(x), date: new Date(x.created_at), amount: x.total })),
  ].sort((a, b) => b.date - a.date).slice(0, 5);
  return {
    collected: sumIn(coll, thisM), last: sumIn(coll, thisM - 1),
    outstanding: open.reduce((s, x) => s + x.total, 0),
    overdue: open.filter(x => x.due_at && new Date(x.due_at) < today).reduce((s, x) => s + x.total, 0),
    pipeline: State.estimates.filter(x => !closed.has(String(x.status || "").toLowerCase())).reduce((s, x) => s + (Number(x.total) || 0), 0),
    months: months.map(m => ({ label: new Date(Math.floor(m / 12), m % 12, 1).toLocaleDateString("en-US", { month: "short" }), billed: sumIn(billed, m), collected: sumIn(coll, m) })),
    activity,
  };
}

/* ---------- views ---------- */
function render() {
  if (!State.session) return renderAuth();
  const f = figures();
  const chg = f.last > 0 ? Math.round((f.collected - f.last) / f.last * 100) : null;
  const month = new Date().toLocaleDateString("en-US", { month: "long" });
  app.innerHTML = `
  <header class="top rise"><span class="logo">${svg("house", 22).replace('stroke="currentColor"', 'stroke="#fff"')}</span><h1>Home</h1>
    <button class="iconbtn glass press" id="refresh" aria-label="Refresh">${svg("refresh", 19)}</button>
    <button class="iconbtn glass press" id="signout" aria-label="Sign out">${svg("out", 19)}</button></header>
  ${State.error ? `<div class="card glass err" role="alert">${esc(State.error)}</div>` : ""}
  <section class="wbal rise" style="margin-top:0">
    <div class="hd"><span>Collected this month</span><span class="pill">${month}</span></div>
    <div class="amt" id="amt" data-v="${f.collected}">${State.loading ? "—" : money(f.collected)}</div>
    <div class="chg ${chg === null ? "" : chg >= 0 ? "up" : "down"}">${chg === null ? "" : `${chg >= 0 ? "↗ +" : "↘ "}${chg}% vs last month`}</div>
    <div class="stats"><div class="st"><span>Outstanding</span><b>${money(f.outstanding)}</b></div><div class="st"><span>Overdue</span><b>${money(f.overdue)}</b></div><div class="st"><span>Pipeline</span><b>${money(f.pipeline)}</b></div></div>
  </section>
  <div class="acts rise" style="animation-delay:.08s">
    <button id="newEstimate" class="press"><span class="orb glass">${svg("doc", 22)}</span>New estimate</button>
    <button id="newProject" class="press"><span class="orb glass">${svg("folder", 22)}</span>New project</button>
  </div>
  <section class="card glass rise" style="animation-delay:.14s"><div class="sh"><h2>Cash flow</h2><span>Last 6 months</span></div>
    <div class="leg"><div><span><i></i>Collected</span><b>${money(f.months.reduce((s, m) => s + m.collected, 0))}</b></div><div><span><i></i>Billed</span><b>${money(f.months.reduce((s, m) => s + m.billed, 0))}</b></div></div>
    ${chart(f.months)}</section>
  <section class="card glass rise" style="animation-delay:.2s"><div class="sh"><h2>Estimates</h2><span>${State.estimates.length} total</span></div>
    ${State.estimates.length ? State.estimates.slice(0, 8).map(estimateRow).join("") : `<div class="empty"><b>No estimates yet</b>Create one with New estimate. It's saved to your account and appears in the app too.</div>`}</section>
  <section class="card glass rise" style="animation-delay:.26s"><div class="sh"><h2>Recent activity</h2></div>
    ${f.activity.length ? f.activity.map(activityRow).join("") : `<div class="empty"><b>No activity yet</b>Payments and invoices from the app show up here.</div>`}</section>`;
  document.getElementById("refresh").onclick = loadAll;
  document.getElementById("signout").onclick = async () => { await db.auth.signOut(); };
  document.getElementById("newEstimate").onclick = () => openEstimateSheet();
  document.getElementById("newProject").onclick = () => openProjectSheet();
  app.querySelectorAll("[data-estimate]").forEach(b => b.onclick = () => openEstimateDetail(b.dataset.estimate));
  rollUp();
}

function chart(months) {
  const w = 320, h = 148, max = Math.max(1, ...months.map(m => Math.max(m.billed, m.collected))) * 1.12;
  const X = i => i * (w / 5), Y = v => h - (v / max) * (h - 12);
  const path = key => months.map((m, i) => { if (!i) return `M0 ${Y(m[key])}`; const x0 = X(i - 1), x1 = X(i), cx = (x0 + x1) / 2; return `C${cx} ${Y(months[i - 1][key])} ${cx} ${Y(m[key])} ${x1} ${Y(m[key])}`; }).join(" ");
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Collected and billed over the last six months">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1D5297" stop-opacity=".28"/><stop offset="1" stop-color="#1D5297" stop-opacity="0"/></linearGradient></defs>
    <path d="${path("collected")} L${X(5)} ${h} L0 ${h}Z" fill="url(#ga)"/>
    <path d="${path("billed")}" fill="none" stroke="rgba(52,127,229,.7)" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <path class="line" d="${path("collected")}" fill="none" stroke="#1D5297" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="mo">${months.map(m => `<span>${m.label}</span>`).join("")}</div></div>`;
}
function estimateRow(e) {
  const p = State.projects.find(x => x.id === e.project_id);
  return `<button class="row" data-estimate="${esc(e.id)}"><span class="ic">${svg("est", 18)}</span><span class="nm"><b>${esc(e.title || "Estimate")}</b><span>${esc(p?.title || "No project")} · ${shortDate(new Date(e.created_at))}</span></span><span class="v">${money(Number(e.total) || 0)}</span></button>`;
}
function activityRow(a) {
  const inc = a.kind === "payment" || a.kind === "paid";
  const icon = { payment: "down", paid: "check", sent: "plane", draft: "est" }[a.kind];
  const label = { payment: "Payment", paid: "Paid", sent: "Sent", draft: "Draft" }[a.kind];
  return `<div class="row"><span class="ic ${inc ? "in" : ""}">${svg(icon, 16)}</span><span class="nm"><b>${esc(a.title)}</b><span>${label} · ${shortDate(a.date)}</span></span><span class="v ${inc ? "in" : ""}">${inc ? "+" : ""}${money(a.amount)}</span></div>`;
}
function rollUp() {
  const el = document.getElementById("amt"); if (!el || State.loading) return;
  const v = Number(el.dataset.v); if (reduce || !v) return;
  let s = null; const step = t => { if (!s) s = t; const k = Math.min(1, (t - s) / 1300); el.textContent = money(Math.round(v * (1 - Math.pow(1 - k, 4)))); if (k < 1) requestAnimationFrame(step); else el.textContent = money(v); };
  requestAnimationFrame(step);
}

/* ---------- sign in ---------- */
let authMode = "in";
function renderAuth(message = "") {
  app.innerHTML = `<div class="auth rise">
    <span class="logo" style="width:56px;height:56px;border-radius:15px">${svg("house", 30).replace('stroke="currentColor"', 'stroke="#fff"')}</span>
    <h1>${authMode === "in" ? "Sign in to EasyBid" : "Create your account"}</h1>
    <p>Use the same account as the EasyBid app. Your estimates, invoices and payments stay in sync.</p>
    <form id="authForm" class="card glass" style="margin-top:20px" novalidate>
      <label class="f">Email<input class="field" id="email" type="email" autocomplete="email" required></label>
      <label class="f">Password<input class="field" id="password" type="password" autocomplete="${authMode === "in" ? "current-password" : "new-password"}" minlength="8" required></label>
      <div class="err" id="authErr" role="alert">${esc(message)}</div>
      <button class="btn press" id="authBtn" style="margin-top:16px">${authMode === "in" ? "Sign in" : "Create account"}</button>
      <p class="note" style="text-align:center;margin-top:14px">${authMode === "in" ? "New to EasyBid?" : "Already have an account?"} <button type="button" class="link" id="authSwitch">${authMode === "in" ? "Create an account" : "Sign in"}</button></p>
      <p class="note" style="text-align:center">Signed up with Apple? Apple sign-in isn't available on the web yet, so keep using the app for now.</p>
    </form></div>`;
  document.getElementById("authSwitch").onclick = () => { authMode = authMode === "in" ? "up" : "in"; renderAuth(); };
  document.getElementById("authForm").onsubmit = async ev => {
    ev.preventDefault();
    const email = document.getElementById("email").value.trim(), password = document.getElementById("password").value;
    const err = document.getElementById("authErr"), btn = document.getElementById("authBtn");
    if (!email || !password) { err.textContent = "Enter your email and password."; return; }
    btn.disabled = true; err.textContent = "";
    const { data, error } = authMode === "in" ? await db.auth.signInWithPassword({ email, password }) : await db.auth.signUp({ email, password });
    btn.disabled = false;
    if (error) { err.textContent = error.message === "Invalid login credentials" ? "That email and password don't match an EasyBid account." : error.message; return; }
    if (authMode === "up" && !data.session) { err.style.color = "var(--accent)"; err.textContent = "Check your email to confirm your account, then sign in."; }
  };
}

/* ---------- sheets ---------- */
function openSheet(html) {
  closeSheet();
  const dim = document.createElement("div"); dim.className = "dim"; dim.id = "dim";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.id = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
  sh.innerHTML = `<div class="grab"></div><button class="x" id="sheetX" aria-label="Close">${svg("x", 16)}</button><div class="in-sheet" id="sheetBody">${html}</div>`;
  document.body.append(dim, sh);
  dim.onclick = () => { if (!busy) closeSheet(); };
  document.getElementById("sheetX").onclick = () => { if (!busy) closeSheet(); };
  return document.getElementById("sheetBody");
}
function closeSheet() { document.getElementById("dim")?.remove(); document.getElementById("sheet")?.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !busy) closeSheet(); });
let busy = false;

/* New project: same row the app writes (projects table). */
function openProjectSheet(onCreated) {
  const body = openSheet(`<h3>New project</h3><p class="note" style="margin-top:2px">Projects hold your estimates, like in the app.</p>
    <label class="f">Project name<input class="field" id="pTitle" maxlength="120" placeholder="Primary bathroom remodel"></label>
    <label class="f">Address (optional)<input class="field" id="pAddr" maxlength="200" autocomplete="street-address"></label>
    <div class="err" id="pErr" role="alert"></div>
    <button class="btn press" id="pSave" style="margin-top:18px">Create project</button>`);
  body.querySelector("#pSave").onclick = async () => {
    const title = body.querySelector("#pTitle").value.trim(), address = body.querySelector("#pAddr").value.trim();
    const err = body.querySelector("#pErr");
    if (!title) { err.textContent = "Give the project a name."; return; }
    try { const p = await createProject(title, address); closeSheet(); await loadAll(); onCreated?.(p); }
    catch (e) { err.textContent = e.message || "The project couldn't be created."; }
  };
}
async function createProject(title, address) {
  if (!State.org) throw new Error("Your account isn't set up yet. Open the EasyBid app once to finish setup.");
  const row = { id: uuid(), organization_id: State.org, project_number: "PRJ-" + (10000 + Math.floor(Math.random() * 90000)), title, price: 0, status: "Draft", address: address || null };
  const { error } = await db.from("projects").insert(row);
  if (error) throw new Error("The project couldn't be created. " + (error.message || ""));
  return row;
}

/* New estimate: the app's AI estimator (smart-service-v7) with the same request format. */
async function hasConsent() {
  const { data, error } = await db.from("ai_consents").select("is_granted,consent_version").eq("user_id", State.session.user.id).limit(1);
  if (error) return false;
  return !!(data?.[0]?.is_granted && data[0].consent_version === AI_CONSENT_VERSION);
}
async function openEstimateSheet(projectId) {
  const consent = await hasConsent();
  let mode = State.projects.length ? "existing" : "new";
  let photo = null;
  const body = openSheet(`<h3>New estimate</h3><p class="note" style="margin-top:2px">Describe the job and EasyBid prices it with local material costs and your labor rates.</p>
    <label class="f" style="margin-bottom:0">Project</label>
    <div class="seg" role="tablist">${State.projects.length ? `<button id="mExisting">Existing</button>` : ""}<button id="mNew">New</button></div>
    <div id="pPick"></div>
    <label class="f">What's the job?<textarea class="field" id="desc" maxlength="4000" placeholder="Remove and replace a 60-inch tub with a walk-in shower, new tile to the ceiling, new vanity and toilet. About 8 x 10 ft."></textarea></label>
    <label class="f">Photo (optional)<input class="field" id="photo" type="file" accept="image/*"></label><div class="photo" id="photoPrev"></div>
    ${consent ? "" : `<label class="check"><input type="checkbox" id="consent"><span>Allow EasyBid to send this description and photo to its AI estimating service to build the estimate. You can turn this off in the app's settings.</span></label>`}
    <div class="err" id="eErr" role="alert"></div>
    <button class="btn blue press" id="eGo" style="margin-top:18px">Create estimate</button>`);
  const pick = body.querySelector("#pPick");
  const showMode = () => {
    body.querySelector("#mExisting")?.classList.toggle("on", mode === "existing");
    body.querySelector("#mNew").classList.toggle("on", mode === "new");
    pick.innerHTML = mode === "existing"
      ? `<select class="field" id="pSel" aria-label="Project">${State.projects.map(p => `<option value="${esc(p.id)}" ${p.id === projectId ? "selected" : ""}>${esc(p.title)}${p.address ? " · " + esc(p.address) : ""}</option>`).join("")}</select>`
      : `<input class="field" id="pNewTitle" maxlength="120" placeholder="Project name" aria-label="Project name"><input class="field" id="pNewAddr" maxlength="200" placeholder="Address (optional)" aria-label="Address">`;
  };
  body.querySelector("#mExisting") && (body.querySelector("#mExisting").onclick = () => { mode = "existing"; showMode(); });
  body.querySelector("#mNew").onclick = () => { mode = "new"; showMode(); };
  showMode();
  body.querySelector("#photo").onchange = async ev => {
    const file = ev.target.files?.[0]; photo = null; body.querySelector("#photoPrev").innerHTML = "";
    if (!file) return;
    try { photo = await shrinkPhoto(file); body.querySelector("#photoPrev").innerHTML = `<img src="data:image/jpeg;base64,${photo}" alt="Selected photo"><span class="note" style="margin:0">Photo attached</span>`; }
    catch { body.querySelector("#eErr").textContent = "That photo couldn't be read. Try a JPEG or PNG."; }
  };
  body.querySelector("#eGo").onclick = async () => {
    const err = body.querySelector("#eErr"); err.textContent = "";
    const desc = body.querySelector("#desc").value.trim();
    if (desc.length < 12) { err.textContent = "Describe the job in a sentence or two."; return; }
    if (!consent && !body.querySelector("#consent").checked) { err.textContent = "Allow AI estimating to continue."; return; }
    let project;
    try {
      if (mode === "existing") project = State.projects.find(p => p.id === body.querySelector("#pSel").value);
      else {
        const t = body.querySelector("#pNewTitle").value.trim();
        if (!t) { err.textContent = "Give the new project a name."; return; }
        project = await createProject(t, body.querySelector("#pNewAddr").value.trim());
      }
      if (!consent) {
        const { error } = await db.rpc("set_ai_consent", { p_granted: true, p_consent_version: AI_CONSENT_VERSION, p_app_version: "web-dashboard" });
        if (error) throw new Error("AI permission couldn't be saved. Please try again.");
      }
    } catch (e) { err.textContent = e.message; return; }
    runEstimate(project, desc, photo);
  };
}
/* Photos are downsized to stay well under the service's 8 MB limit. */
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", .85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

const STAGES = ["Reading the job", "Planning the work", "Pricing materials near you", "Adding labor at your rates", "Checking the totals", "Saving the estimate"];
async function runEstimate(project, desc, photo) {
  busy = true;
  const body = document.getElementById("sheetBody");
  body.innerHTML = `<h3>Building your estimate</h3><p class="note" style="margin-top:2px">${esc(project.title)}</p>
    <div class="spin" aria-hidden="true"></div><p style="text-align:center;font:600 15px var(--rounded);margin:0" id="stage">${STAGES[0]}…</p>
    <p class="note" style="text-align:center" id="elapsed">This usually takes 1 to 3 minutes. You can leave this open.</p>`;
  const started = Date.now();
  const tick = setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    const st = document.getElementById("stage"); if (st) st.textContent = STAGES[Math.min(STAGES.length - 1, Math.floor(s / 22))] + "…";
    const el = document.getElementById("elapsed"); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} · This usually takes 1 to 3 minutes.`;
  }, 1000);
  try {
    const result = await requestEstimate({ request_id: uuid(), operation: "generate", project_id: project.id, chat_session_id: uuid(), messages: [{ role: "user", content: desc }],
      ...(photo ? { attachment_kind: "photo", attachment_mime_type: "image/jpeg", attachment_base64: photo } : {}) });
    clearInterval(tick); busy = false;
    if (!result.estimate_id) throw new Error(result.reply || "The estimator needs more detail. Add a little more about the job and try again.");
    await loadAll();
    await openEstimateDetail(result.estimate_id, true);
  } catch (e) {
    clearInterval(tick); busy = false;
    const b = document.getElementById("sheetBody");
    if (b) b.innerHTML = `<h3>Estimate not finished</h3><p class="err" role="alert">${esc(e.message || "The estimate could not be completed.")}</p>
      <p class="note">Your project is saved. If the estimate was saved anyway, it will appear on the dashboard after a refresh.</p>
      <button class="btn press" id="eBack" style="margin-top:16px">Try again</button>`;
    document.getElementById("eBack")?.addEventListener("click", () => openEstimateSheet(project.id));
  }
}
/* Mirrors the app's retry rules: wait while a request is in progress, check once for a
   result that saved after a lost response, and retry network drops with the same request id. */
async function requestEstimate(payload) {
  const deadline = Date.now() + 420000; let checkedFailure = false, recovered = 0, netFails = 0;
  const pause = ms => new Promise(r => setTimeout(r, ms));
  while (true) {
    const { data: { session } } = await db.auth.getSession();
    if (!session) throw new Error("You were signed out. Sign in again and retry.");
    let res, json;
    try {
      res = await fetch(ESTIMATOR_URL, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: SUPABASE_KEY }, body: JSON.stringify(payload) });
      json = await res.json().catch(() => ({}));
    } catch {
      if (++netFails > 3 || Date.now() > deadline) throw new Error("The connection dropped. Check your internet and try again.");
      await pause(2000); continue;
    }
    const code = json.code || "", status = json.http_status || res.status;
    if (Date.now() < deadline) {
      if (code === "request_in_progress") { await pause(2000); continue; }
      if (["request_failed", "residential_validation", "catalog_resolution", "estimator_timeout", "internal_error"].includes(code) && !checkedFailure) { checkedFailure = true; await pause(1000); continue; }
      if (code === "request_failed" && recovered < 1) { recovered++; checkedFailure = false; payload = { ...payload, request_id: uuid() }; await pause(1000); continue; }
    }
    if (status >= 400) {
      const known = { ai_consent_required: "Allow AI estimating to continue.", ai_quota_exceeded: "You've reached your AI estimate limit. Check your plan in the app.", rate_limited: "Too many requests. Wait a moment and try again." };
      throw new Error(known[code] || json.error || "The estimate could not be completed. Please try again.");
    }
    return json;
  }
}

async function openEstimateDetail(id, fresh = false) {
  const body = openSheet(`<div class="spin" aria-label="Loading"></div>`);
  const [{ data: est, error: e1 }, { data: items, error: e2 }] = await Promise.all([
    db.from("estimates").select("*").eq("id", id).maybeSingle(),
    db.from("estimate_items").select("category,name,quantity,unit_label,unit_price,total").eq("estimate_id", id),
  ]);
  if (e1 || e2 || !est) { body.innerHTML = `<h3>Estimate</h3><p class="err">This estimate couldn't be loaded.</p>`; return; }
  const p = State.projects.find(x => x.id === est.project_id);
  const cats = {}; for (const it of items || []) (cats[it.category || "Items"] ||= []).push(it);
  const row = (l, v, cls = "") => `<div class="${cls}"><span>${l}</span><span>${money(Number(v) || 0)}</span></div>`;
  body.innerHTML = `${fresh ? `<p class="pill" style="display:inline-block;background:rgba(52,199,89,.15);color:var(--green);margin:4px 0 0">Saved to your account</p>` : ""}
    <h3>${esc(est.title || "Estimate")}</h3><p class="note" style="margin-top:2px">${esc(p?.title || "")}${est.estimate_number ? " · " + esc(est.estimate_number) : ""}${est.status ? `<span class="tag">${esc(est.status)}</span>` : ""}</p>
    ${Object.entries(cats).map(([c, list]) => `<div class="cat">${esc(c)}</div>${list.map(it => `<div class="item"><span>${esc(it.name || "Item")}<br><span class="q">${Number(it.quantity) || 0} ${esc(it.unit_label || "")} × ${money(Number(it.unit_price) || 0)}</span></span><b>${money(Number(it.total) || 0)}</b></div>`).join("")}`).join("") || `<p class="empty">No line items.</p>`}
    <div class="totals">${row("Subtotal", est.subtotal)}${Number(est.markup_amount) ? row(`Markup ${Number(est.markup_pct) || 0}%`, est.markup_amount) : ""}${Number(est.contingency_amount) ? row(`Contingency ${Number(est.contingency_pct) || 0}%`, est.contingency_amount) : ""}${row("Total", est.total, "t")}</div>
    ${Array.isArray(est.exclusions) && est.exclusions.length ? `<div class="cat">Not included</div><p class="note">${est.exclusions.map(esc).join("<br>")}</p>` : ""}
    <p class="note">Open the EasyBid app to edit, send or invoice this estimate.</p>`;
}

// Fires once at start (INITIAL_SESSION) and on every sign-in / sign-out.
db.auth.onAuthStateChange((_event, session) => {
  const was = State.session?.user?.id; State.session = session;
  if (!session) { closeSheet(); render(); return; }
  if (session.user.id !== was) setTimeout(loadAll, 0);
});
