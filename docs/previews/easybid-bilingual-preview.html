<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyBid Bilingual Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a working-surface page — two live phone screens side by side, then the full phrasebook and release notes underneath. */
:root{
  --navy:#0B2E5A; --sky:#347FE5; --accent:#1D5297;
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5A6B80; --line:#DCE3EC; --chip:#E6EEF8; --mark:#FFF1C2;
  --f-display:"Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1320;--surface:#121D2E;--ink:#E7EEF7;--muted:#93A4BA;--line:#24344B;--chip:#1A2A41;--mark:#4A3D12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1320;--surface:#121D2E;--ink:#E7EEF7;--muted:#93A4BA;--line:#24344B;--chip:#1A2A41;--mark:#4A3D12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
:root[data-theme="dark"] .eyebrow{color:#7FB0F5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eyebrow{color:#7FB0F5}}
h1{font:800 clamp(28px,4vw,40px)/1.1 var(--f-display);margin:8px 0 8px;text-wrap:balance}
h2{font:800 22px/1.2 var(--f-display);margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:32px 24px;justify-items:center;align-items:start}
.device{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.device figcaption{font-size:13px;color:var(--muted);text-align:center;max-width:34ch}
.phone{width:min(340px,100%);aspect-ratio:9/19;max-width:100%;border-radius:46px;padding:10px;background:#0A0F17;box-shadow:0 30px 60px -30px rgba(11,46,90,.55),inset 0 0 0 2px #1E2633;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;font-family:var(--f-display);color:#fff;background:linear-gradient(var(--navy),var(--sky));transition:background .35s}
.screen.light{background:#fff;color:var(--navy)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:#0A0F17;z-index:5}
.nav{position:absolute;top:50px;left:0;right:0;display:flex;align-items:center;gap:14px;padding:0 14px 0 20px;z-index:4}
.back{border:0;background:none;color:inherit;font-size:22px;cursor:pointer;padding:2px 4px;line-height:1}
.progress{flex:1;height:5px;border-radius:9px;background:rgba(11,46,90,.82);overflow:hidden}
.light .progress{background:#E1E7EE}
.progress i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .55s ease}
.light .progress i{background:var(--sky)}
/* EN/ES pill — mirrors LanguageToggle.swift */
.lt{position:relative;display:inline-flex;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(11,46,90,.82);cursor:pointer;font:800 12.5px/1 var(--f-display);user-select:none;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .25s}
.lt:active{transform:scale(.94)}
.lt:focus-visible{outline:3px solid #9CC3FF;outline-offset:2px}
.lt .knob{position:absolute;top:3px;left:3px;width:34px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1.5px 3px rgba(0,0,0,.18);transition:transform .42s cubic-bezier(.34,1.56,.64,1),background .25s}
.lt[data-lang="es"] .knob{transform:translateX(34px)}
.lt b{position:relative;width:34px;height:26px;display:grid;place-items:center;color:rgba(255,255,255,.78);transition:color .25s;font-weight:800}
.lt[data-lang="en"] b.en,.lt[data-lang="es"] b.es{color:var(--navy)}
.lt.light{background:#E1E7EE;border-color:rgba(0,0,0,.06)}
.lt.light .knob{background:var(--sky)}
.lt.light b{color:rgba(11,46,90,.55)}
.lt.light[data-lang="en"] b.en,.lt.light[data-lang="es"] b.es{color:#fff}
.lt.page{background:var(--chip);border-color:var(--line)}
.lt.page .knob{background:var(--accent)}
.lt.page b{color:var(--muted)}
.lt.page[data-lang="en"] b.en,.lt.page[data-lang="es"] b.es{color:#fff}
[data-t]{transition:opacity .22s ease}
.fading [data-t]{opacity:0}
.page-body{position:absolute;inset:88px 0 0;display:flex;flex-direction:column;padding:8px 22px 24px;overflow-y:auto;scrollbar-width:none}
.page-body::-webkit-scrollbar{display:none}
.page-body .btn{flex-shrink:0}
.page-body h3{font:800 21px/1.16 var(--f-display);margin:14px 0 8px;white-space:pre-line;text-wrap:balance}
.page-body p{font:600 13.5px/1.42 var(--f-display);margin:0;opacity:.92;white-space:pre-line}
.grow{flex:1}
.btn{border:0;border-radius:999px;height:44px;font:800 14.5px var(--f-display);flex-shrink:0;cursor:pointer;width:100%}
.btn.white{background:#fff;color:#000}
.btn.glass{background:rgba(11,46,90,.82);color:#fff;margin-top:8px}
.btn.ink{background:#141419;color:#fff}
.btn:focus-visible{outline:3px solid #9CC3FF;outline-offset:2px}
.small{font:600 12px/1.35 var(--f-display);text-align:center;margin-top:9px;opacity:.85}
.legal{font-size:9.5px;line-height:1.35;opacity:.75;text-align:center;margin-top:6px}
.stars{margin-top:12px;font-size:16px;letter-spacing:2px;color:#FFD34D}
.stars small{display:block;font:700 12px var(--f-display);letter-spacing:0;color:#fff;opacity:.85;margin-top:2px}
.quote{margin-top:12px;background:#fff;color:var(--navy);border-radius:14px;padding:10px 12px;font:700 12px/1.35 var(--f-display)}
.quote em{display:block;font-style:normal;font-weight:600;color:#5A6B80;margin-top:4px;font-size:11px}
.card{background:#fff;color:#0F1B2D;border-radius:16px;padding:10px 12px;margin-top:12px;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.card .row{display:flex;justify-content:space-between;gap:10px;font:700 12px/1.3 var(--f-display);padding:4px 0;border-bottom:1px solid #EEF2F6;font-variant-numeric:tabular-nums}
.card .row:last-child{border:0}
.card h4{margin:0 0 4px;font:800 13px/1.25 var(--f-display);white-space:pre-line}
.tag{display:inline-block;font:800 10px var(--f-display);background:#E8F0FB;color:var(--accent);padding:3px 8px;border-radius:999px;margin-bottom:6px}
.zip{margin-top:16px;background:#fff;border-radius:14px;height:54px;display:grid;place-items:center;color:#9AA7B6;font:700 22px var(--f-display);letter-spacing:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{border:1px solid #DCE3EC;border-radius:14px;padding:11px 14px;font:700 14px var(--f-display);color:var(--navy);background:#fff;text-align:left;cursor:pointer}
.opt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qtitle{text-align:center}
.qtitle span{display:block;color:var(--accent)}
.check{font:700 14.5px/1.9 var(--f-display);text-align:center;color:#141419}
.ring{width:108px;height:108px;border-radius:50%;margin:18px auto 10px;display:grid;place-items:center;font:800 28px var(--f-display);background:conic-gradient(#fff 0 var(--p,72%),rgba(255,255,255,.22) 0);-webkit-mask:radial-gradient(farthest-side,transparent 78%,#000 79%);mask:radial-gradient(farthest-side,transparent 78%,#000 79%)}
.ringlabel{text-align:center;font:800 26px var(--f-display);margin-top:-82px;margin-bottom:52px}
/* app screen */
.app{background:linear-gradient(#fff,#EEF2F7);color:#0F1B2D}
.app .head{position:absolute;top:50px;left:18px;right:14px;display:flex;justify-content:space-between;align-items:center}
.app .head h3{font:800 22px var(--f-display);margin:0}
.app .body{position:absolute;inset:92px 14px 78px;overflow:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.app .tile{background:#fff;border:1px solid #E4EAF1;border-radius:16px;padding:12px 14px}
.app .tile h5{margin:0 0 8px;font:800 14px var(--f-display);display:flex;justify-content:space-between;color:#0F1B2D}
.app .tile h5 small{font-weight:700;color:var(--accent);font-size:12px}
.app .li{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 13px var(--f-display);padding:6px 0;color:#2B3A4D;border-top:1px solid #F0F3F7;font-variant-numeric:tabular-nums}
.app .li:first-of-type{border:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;background:#C8D0D8}
.dot.ok{background:#2E7D32}
.app .qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.app .qa div{background:#EEF4FC;border-radius:12px;padding:10px 6px;text-align:center;font:800 12px var(--f-display);color:var(--accent);min-width:0;overflow-wrap:anywhere}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:56px;border-radius:28px;background:#fff;box-shadow:0 6px 20px rgba(11,46,90,.15);display:flex;justify-content:space-around;align-items:center}
.tabbar button{border:0;background:none;font:800 11px var(--f-display);color:#8A97A8;cursor:pointer;padding:6px 10px;border-radius:14px}
.tabbar button.on{color:var(--accent);background:#EEF4FC}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font:700 13.5px var(--f-display);padding:9px 0;border-top:1px solid #F0F3F7;color:#2B3A4D}
.set-row:first-of-type{border:0}
.set-sec{font:800 11px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:#8A97A8;margin:4px 4px -6px}
.danger{color:#C62828}
/* phrasebook */
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input{flex:1 1 240px;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:500 15px var(--f-body)}
.tools input:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.count{font:500 13px var(--f-mono);color:var(--muted)}
.tablebox{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{position:sticky;top:0;background:var(--surface);font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);z-index:1}
td{white-space:pre-line}
td code{font:500 12.5px var(--f-mono);background:var(--chip);padding:1px 5px;border-radius:5px}
mark{background:var(--mark);color:inherit;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.app .li>span+span,.app .li>b{white-space:nowrap;text-align:right;color:#5A6B80;font-size:12px}
.app .li>b{color:#0F1B2D;font-size:13px}
.app .li>span:first-child{min-width:0}
.app .li.note{color:#2E7D32}
.set-row>span:first-child{white-space:nowrap}
.set-row>span+span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .li{font-size:12px}
.steps .li>span+span{font:800 10px var(--f-display);background:#EEF2F7;color:#5A6B80;border-radius:999px;padding:3px 7px}
.set-row.stack{flex-direction:column;align-items:flex-start;gap:2px}
.set-row.stack>span+span{color:#8A97A8;font-size:12.5px;max-width:100%}

.paper{width:min(300px,100%);aspect-ratio:8.5/11;max-width:100%;background:#fff;color:#1B2433;border-radius:6px;box-shadow:0 24px 50px -28px rgba(11,46,90,.55),0 0 0 1px rgba(11,46,90,.08);padding:20px 18px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-body);font-size:8.5px;line-height:1.35;overflow:hidden}
.paper .ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.paper .co b{display:block;font:700 11px var(--f-body)}
.paper .co span{color:#6B7787}
.paper .meta{background:#F4F7FB;border-radius:4px;overflow:hidden;min-width:104px}
.paper .meta i{display:block;font-style:normal;background:var(--accent);color:#fff;font-weight:700;padding:4px 7px;font-size:7.5px;letter-spacing:.04em}
.paper .meta div{display:flex;justify-content:space-between;gap:8px;padding:3px 7px;color:#6B7787}
.paper .meta div b{color:#1B2433}
.paper .lbl{font-weight:700;color:var(--accent);font-size:7.5px;letter-spacing:.06em}
.paper table{min-width:0;width:100%;border-collapse:collapse;font-size:8px}
.paper th{position:static;background:var(--accent);color:#fff;font:700 7px var(--f-body);letter-spacing:.04em;padding:4px 5px;text-transform:none}
.paper td{padding:4px 5px;border-bottom:1px solid #EDF1F6;font-size:8px;white-space:normal;font-variant-numeric:tabular-nums}
.paper .r{text-align:right}
.paper .tot{align-self:flex-end;width:62%;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.paper .tot div{display:flex;justify-content:space-between;color:#6B7787}
.paper .tot div.big{color:#1B2433;font-weight:800;font-size:10px;border-top:1px solid #DCE3EC;padding-top:3px}
.paper .fine{color:#6B7787;font-size:7px}
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <figure class="device" style="margin:0">
      <div class="phone"><div class="screen" id="ob">
        <div class="notch"></div>
        <div class="nav">
          <button type="button" class="back" id="obBack" aria-label="Previous">←</button>
          <div class="progress"><i id="obProg"></i></div>
          <div class="lt" role="switch" tabindex="0" aria-label="Language" data-lang="en"><div class="knob"></div><b class="en">EN</b><b class="es">ES</b></div>
        </div>
        <div class="page-body" id="obBody"></div>
      </div></div>
      <figcaption>Onboarding: the toggle sits top-right on every page, and switches to a light style on the white survey pages.</figcaption>
    </figure>

    <figure class="device" style="margin:0">
      <div class="phone"><div class="screen app" id="app">
        <div class="notch"></div>
        <div class="head"><h3 id="appTitle" data-t>Home</h3></div>
        <div class="body" id="appBody"></div>
        <nav class="tabbar" id="tabs" aria-label="App tabs"></nav>
      </div></div>
      <figcaption>Inside the app: Home and Settings. Settings → Language has the same toggle.</figcaption>
    </figure>
    <figure class="device" style="margin:0">
      <div class="paper" id="pdf" role="region" aria-label="Invoice PDF preview"></div>
      <figcaption>The invoice PDF your client receives is generated in the active language too.</figcaption>
    </figure>
  </div>

  <section class="panel" aria-labelledby="pb">
    <div>
      <h2 id="pb">Phrasebook</h2>
      <p class="lede">Every string the app translates. Placeholders like <code style="font-family:var(--f-mono)">%@</code> are filled in with names, numbers and amounts at runtime.</p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search English or Spanish…" aria-label="Search translations">
      <span class="count" id="count"></span>
    </div>
    <div class="tablebox"><table><thead><tr><th scope="col" style="width:50%">English</th><th scope="col">Español</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>

</div>

/* ---------- phrasebook ---------- */
const entries = Object.entries(ES).sort((a,b)=>a[0].localeCompare(b[0]));
function hl(s,q){ const e=esc(s).replace(/%l?[d@]|%%/g,m=>`<code>${m}</code>`); if(!q) return e;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"); return e.replace(/(<code>.*?<\/code>)|([^<]+)/g,(m,c,txt)=>c?c:txt.replace(re,x=>`<mark>${x}</mark>`)); }
function renderRows(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = q ? entries.filter(([k,v])=>k.toLowerCase().includes(q)||v.toLowerCase().includes(q)) : entries;
  document.getElementById("rows").innerHTML = list.slice(0,400).map(([k,v])=>`<tr><td>${hl(k,q)}</td><td>${hl(v,q)}</td></tr>`).join("") || `<tr><td colspan="2" style="color:var(--muted)">No matches. Try a shorter word, such as “factura”.</td></tr>`;
  document.getElementById("count").textContent = q ? `${list.length} of ${entries.length} phrases` + (list.length>400?" (first 400 shown)":"") : `${entries.length} phrases` + (entries.length>400?" · search to see all":"");
}
document.getElementById("q").addEventListener("input", renderRows);

/* ---------- language switching ---------- */
function bindToggles(){
  document.querySelectorAll(".lt").forEach(el=>{
    el.dataset.lang = lang; el.setAttribute("aria-checked", lang==="es"); el.setAttribute("aria-label", T("Language"));
    if (el._b) return; el._b = true;
    el.addEventListener("click", ()=>setLang(lang==="en"?"es":"en"));
    el.addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); setLang(lang==="en"?"es":"en"); } });
  });
}
function setLang(l){
  lang = l; try{ localStorage.setItem("eb-lang", l); }catch(e){}
  document.querySelectorAll(".lt").forEach(el=>{ el.dataset.lang = l; el.setAttribute("aria-checked", l==="es"); });
  document.documentElement.lang = l;
  const scr = [document.getElementById("ob"), document.getElementById("app"), document.getElementById("pdf")];
  scr.forEach(s=>s.classList.add("fading"));
  setTimeout(()=>{ renderOB(); renderApp(); renderPDF(); scr.forEach(s=>s.classList.remove("fading")); }, 180);
}
renderOB(); renderApp(); renderPDF(); renderRows(); bindToggles();
