<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyBid Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: the iPhone screen is drawn at its real size in points (402 x 874, iPhone 16 Pro) using the
   app's own measurements, then scaled as one piece to fit the window. A slim jump strip sits above. */
:root{
  /* AppBrand / AppGray tokens from AppGray.swift (iOS light-mode values) */
  --dark:#0B2E5A; --light:#347FE5; --accent:#1D5297;
  --ink:#141419; --textDark:#262626; --itemText:#4D4D54; --subtle:#797983;
  --secondary:#8E8E93; --muted:#AEAEB2; --border:#C7C7CC; --borderStrong:#C7C7CC; --badge:#E5E5EA;
  --pill:#F6F6F7; --bgFaint:#F2F2F7; --bgPale:#F9F9F9; --sysBlue:#007AFF; --red:#FF3B30; --green:#34C759;
  /* Apple system fonts first: SF Pro Rounded / SF Pro on Apple devices, close web fallbacks elsewhere */
  --rounded: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Inter", system-ui, "Helvetica Neue", sans-serif;
  --stage:#E7ECF2; --stageInk:#1B2A3C; --stageSub:#5D6E83; --stageLine:#CFD8E3; --stageCard:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#0C131D;--stageInk:#E3EAF3;--stageSub:#93A3B7;--stageLine:#24344A;--stageCard:#152134;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#0C131D;--stageInk:#E3EAF3;--stageSub:#93A3B7;--stageLine:#24344A;--stageCard:#152134;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--stageInk);font-family:var(--sf);-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:640px}
.strip button{border:1px solid var(--stageLine);background:var(--stageCard);color:var(--stageInk);font:600 13px var(--sf);padding:7px 13px;border-radius:999px;cursor:pointer}
.strip button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.strip button:focus-visible,.dev button:focus-visible,.dev [tabindex]:focus-visible{outline:3px solid #7FB0F5;outline-offset:2px}
.hint{font-size:12.5px;color:var(--stageSub);text-align:center;max-width:52ch;margin:0}
.fit{position:relative}
.bezel{position:absolute;top:0;left:0;width:426px;height:898px;transform-origin:0 0;border-radius:66px;padding:12px;background:#0A0F17;box-shadow:0 50px 90px -45px rgba(11,46,90,.65),inset 0 0 0 2px #262F3D}

/* ===== device canvas: 1 CSS px = 1 iOS point ===== */
.dev{position:relative;width:402px;height:874px;border-radius:55px;overflow:clip;background:#fff;color:var(--ink);font-family:var(--sf);font-size:17px;line-height:1.2;isolation:isolate}
:where(.dev button){font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:100}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 46px;font:600 17px var(--sf);z-index:99;pointer-events:none}
.sbar.white{color:#fff}
.sbar .r{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#000;z-index:99;pointer-events:none}
.home-ind.white{background:#fff}
.screen{position:absolute;inset:0;overflow:clip}
[data-t]{transition:opacity .2s}
.switching [data-t]{opacity:0}
.ic{display:inline-block;flex:none}

/* ===== onboarding ===== */
.grad{background:linear-gradient(var(--dark),var(--light))}
.obnav{position:absolute;top:80px;left:0;right:0;display:flex;align-items:center;gap:22px;padding:0 20px 0 28px;z-index:30;height:34px}
.obnav .back{width:34px;height:34px;display:grid;place-items:center;color:#fff}
.obnav.lightbg .back{color:var(--dark)}
.obnav .bar{flex:1;height:5.75px;border-radius:3px;background:rgba(11,46,90,.82);overflow:hidden}
.obnav.lightbg .bar{background:#E1E7EE}
.obnav .bar i{display:block;height:100%;border-radius:3px;background:#fff;transition:width .55s ease}
.obnav.lightbg .bar i{background:var(--light)}
/* LanguageToggle.swift */
.lt{position:relative;display:inline-flex;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(11,46,90,.82);cursor:pointer;font:700 12.5px/1 var(--rounded);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s;flex:none}
.lt:active{transform:scale(.94)}
.lt .knob{position:absolute;top:3px;left:3px;width:34px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1.5px 3px rgba(0,0,0,.18);transition:transform .42s cubic-bezier(.34,1.56,.64,1),background .25s}
.lt[data-lang="es"] .knob{transform:translateX(34px)}
.lt b{position:relative;width:34px;height:26px;display:grid;place-items:center;color:rgba(255,255,255,.78);transition:color .25s;font-weight:700}
.lt[data-lang="en"] b.en,.lt[data-lang="es"] b.es{color:var(--dark)}
.lt.light{background:#E1E7EE;border-color:rgba(0,0,0,.06)}
.lt.light .knob{background:var(--light)}
.lt.light b{color:rgba(11,46,90,.55)}
.lt.light[data-lang="en"] b.en,.lt.light[data-lang="es"] b.es{color:#fff}

/* AppleAuthOnboardingPage */
.auth{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;font-family:var(--rounded)}
.auth .copy{padding:123px 34px 0}
.auth h1{font:700 31px/1.18 var(--sf);margin:0}
.auth .sub{font:500 17.6px/1.38 var(--rounded);margin:15px 0 0;white-space:pre-line}
.auth .rating{display:block;width:165px;height:89.1px;margin-top:34px}
.auth .gap{flex:1;min-height:12px}
.carousel{height:188px;width:402px;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.trow{height:85.8px;display:flex;gap:16px;width:max-content;will-change:transform}
.trow.l{animation:slideL var(--dur) linear infinite}
.trow.r{animation:slideR var(--dur) linear infinite}
@keyframes slideL{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--w)))}}
@keyframes slideR{from{transform:translateX(calc(-1 * var(--w)))}to{transform:translateX(0)}}
.tcard{width:234.3px;height:85.8px;flex:none;background:#fff;border:1px solid rgba(11,46,90,.08);border-radius:15.4px;display:flex;align-items:center;gap:10px;padding:0 14.3px;color:var(--dark)}
.tcard .av{width:44px;height:44px;border-radius:50%;background:rgba(11,46,90,.08);display:grid;place-items:center;font:500 14.3px var(--rounded);flex:none}
.tcard .q{font:500 12.65px/1.25 var(--rounded);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .a{font:400 10.45px var(--rounded);color:rgba(11,46,90,.68);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth .btns{padding:0 32px 58px;display:flex;flex-direction:column;gap:12px}
.capbtn{height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px var(--rounded)}
.capbtn.white{background:#fff;color:#000}
.capbtn.glass{background:rgba(11,46,90,.82);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 1px 0 rgba(255,255,255,.08)}
.loginrow{font:400 16px var(--rounded);color:#fff;text-align:center}
.loginrow b{font-weight:600}
.legal{font:400 10px/1.35 var(--rounded);color:rgba(255,255,255,.78);text-align:center;margin-top:3px}
.legal b{font-weight:700;color:#fff;text-decoration:underline}

/* OnboardingPageView */
.art{position:absolute;left:50%;transform:translateX(-50%);background:#fff;overflow:hidden;z-index:2}
.art.photo{z-index:0}
.panel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#fff,#F7F9FC);box-shadow:0 -4px 18px rgba(0,0,0,.10);z-index:1}
.copyblock{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:3}
.ttl{font:500 23.74px/1.22 var(--rounded);color:var(--ink);text-align:center;margin:0;white-space:pre-line}
.subt{font:400 16.37px/1.4 var(--rounded);color:rgba(77,77,84,.78);text-align:center;margin:0}
.next{height:51.25px;border-radius:999px;background:var(--ink);color:#fff !important;display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px var(--rounded);box-shadow:0 5px 10px rgba(20,20,25,.18);width:100%;transition:background .2s,box-shadow .2s}
.next.off{background:rgba(20,20,25,.35);box-shadow:none;cursor:default}
.fadeout{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
/* photo analysis */
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.photo .shade{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,rgba(0,0,0,.08) 18%,rgba(0,0,0,.24) 52%,rgba(0,0,0,.34) 76%,rgba(0,0,0,.34))}
.scanwrap{position:absolute;left:0;right:0;top:0;overflow:hidden}
.scan{position:absolute;left:0;right:0;height:100px;filter:blur(9px);mix-blend-mode:screen;background:linear-gradient(transparent,rgba(255,255,255,.18) 16%,rgba(255,255,255,.42) 32%,rgba(255,255,255,.78) 43%,#fff 50%,rgba(255,255,255,.78) 57%,rgba(255,255,255,.42) 68%,rgba(255,255,255,.18) 84%,transparent);animation:scan 4s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(var(--from))}50%{transform:translateY(var(--to))}}
.callout{position:absolute;transform:translate(-50%,-50%) scale(.92);opacity:0;background:#fff;border-radius:9px;padding:7px 10px;box-shadow:0 5px 11px rgba(0,0,0,.30),0 1px 3px rgba(0,0,0,.12);transition:opacity .35s,transform .46s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}
.callout.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.callout .t{font:600 10.5px/1.2 var(--rounded);color:var(--ink)}
.callout .a{font:700 12.5px/1.25 var(--rounded);color:var(--ink);margin-top:2px}
/* estimate / invoice cards */
.rv{opacity:0;transform:translateY(8px);transition:opacity .38s ease-out,transform .38s ease-out}
.rv.on{opacity:1;transform:none}
.div{height:.7px;background:rgba(229,229,234,.85)}
.erow{height:50px;display:flex;align-items:center;padding:0 24px;font:500 13px var(--sf);color:var(--itemText);gap:3px;font-variant-numeric:tabular-nums}
.erow span:first-child{flex:1}
.erow b{font-weight:600}
.dpill{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);font:500 11.5px var(--sf);color:var(--secondary);background:#fff}
.dpill i{width:10px;height:10px;border-radius:50%;border:1px solid var(--secondary)}
.inv{font-family:var(--sf)}
.inv .hd{display:flex;justify-content:space-between;gap:10px;padding:19px 24px 16px}
.inv .hd .co b{display:block;font:600 18px var(--sf);color:var(--ink)}
.inv .hd .co span{display:block;font:400 13px var(--sf);color:var(--secondary);margin-top:8px}
.inv .hd .no{text-align:right}
.inv .hd .no b{display:block;font:700 18px var(--sf);color:var(--ink)}
.inv .hd .no span{display:block;font:400 12.5px var(--sf);color:var(--secondary);margin-top:5px}
.inv .bill{display:flex;gap:18px;padding:16px 24px;font:400 12px/1.2 var(--sf);color:var(--secondary)}
.inv .bill>div{flex:1;display:flex;flex-direction:column;gap:8px}
.inv .bill .h{font:500 12px var(--sf);color:var(--itemText)}
.inv .bill .n{font:600 12.5px var(--sf);color:var(--itemText)}
.inv .th,.inv .tr{display:flex;padding:0 24px;font-variant-numeric:tabular-nums}
.inv .th{height:28px;align-items:center;font:600 12px var(--sf);color:var(--itemText)}
.inv .tr{padding-top:16px;padding-bottom:16px;font:400 12.5px/1.25 var(--sf);color:var(--secondary);align-items:flex-start}
.inv .c1{flex:1;min-width:0}
.inv .c2{width:28px;text-align:center;white-space:nowrap;overflow:hidden}
.inv .c3{width:60px;text-align:right}
.inv .tdiv{height:.7px;background:rgba(229,229,234,.85);margin:0 24px}
/* zip */
.zipfield{height:48px;margin:0 12px;border-radius:12px;border:1px solid var(--border);background:#fff;display:flex}
.zipfield input{flex:1;min-width:0;border:0;outline:0;background:none;text-align:center;font:500 19px var(--rounded);color:var(--ink)}
.zipfield input::placeholder{color:#C4C4C7}
/* local graph */
.glabel{position:absolute;font:600 13.75px var(--rounded);color:#fff;text-shadow:0 1px 1.5px rgba(0,0,0,.18);white-space:nowrap}
/* questionnaire */
.qwrap{position:absolute;inset:0;display:flex;flex-direction:column;padding-bottom:58px;background:#fff}
.qtitle{text-align:center;font:600 24.75px/1.25 var(--rounded);padding:0 26px 34px;transform:translateY(-25px);color:var(--dark)}
.qtitle .hl{display:block;color:var(--light);margin-top:4px}
.qopts{display:flex;flex-direction:column;gap:12px;padding:0 26px}
.qopt{height:56.375px;border-radius:15px;border:1px solid rgba(199,199,204,.8);background:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--dark) !important;text-align:left;transition:background .22s,color .22s,border-color .22s}
.qopt span{flex:1;font:500 17px var(--rounded)}
.qopt.on{background:var(--ink);color:#fff !important;border-color:transparent}
.qopt.on span{font-weight:600}
.qopt .rad{width:21.25px;height:21.25px;border-radius:50%;border:1px solid rgba(199,199,204,.8);display:grid;place-items:center;flex:none}
.qopt.on .rad{background:#fff;border-color:#fff;color:var(--ink)}
/* estimator build */
.tools{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:14px;justify-content:center;opacity:.48;filter:blur(2.25px);overflow:hidden}
.tools .row{display:flex;gap:16px;width:max-content}
.tile{width:100px;height:100px;border-radius:24px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.10);display:grid;place-items:center;color:rgba(255,255,255,.95)}
.ring{position:absolute;width:156px;height:156px;left:123px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.14))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 32px var(--rounded);color:#fff;font-variant-numeric:tabular-nums}
.checklist{display:flex;flex-direction:column;gap:14px;align-items:center}
.checklist div{position:relative;font:500 18.7px var(--rounded);color:var(--muted);transition:color .25s}
.checklist div.on{color:var(--ink)}
.checklist svg{position:absolute;left:-26px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .25s;color:var(--secondary)}
.checklist div.on svg{opacity:1}

/* ===== app (ContentView) ===== */
.appbg{background:linear-gradient(#fff,var(--bgPale))}
.topnav{position:absolute;top:62px;left:0;right:0;height:70px;display:flex;align-items:center;gap:12px;padding:8px 20px 12px;z-index:5}
.circ{width:44px;height:44px;border-radius:50%;background:var(--pill);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07);display:grid;place-items:center;color:#000 !important;position:relative;flex:none}
.circ.accent{background:var(--accent);color:#fff !important}
.nbadge{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;padding:0 4px;background:var(--accent);color:#fff;font:700 9px/17px var(--sf);text-align:center}
.newbtn{display:flex;align-items:center;gap:6px;padding:15px 22px;border-radius:999px;background:var(--accent);color:#fff !important;font:600 17px/20px var(--sf);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.ptitle{position:absolute;left:20px;right:20px;font:700 32px/38px var(--sf);color:var(--ink);letter-spacing:.2px}
.scrollv{position:absolute;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scrollv::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column}
.h20{font:600 20px var(--sf);color:var(--ink)}
.card14{background:#fff;border-radius:14px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.06);overflow:hidden}
.gsbar{height:54px;width:100%;background:var(--accent);color:#fff !important;display:flex;align-items:center;gap:14px;padding:0 16px;font:500 15px var(--sf)}
.gsbar .track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.gsbar .track i{display:block;height:100%;background:#fff;border-radius:3px}
.gsrow{position:relative;height:54px;width:100%;display:flex;align-items:center;gap:11px;padding:0 16px;text-align:left}
.gsrow .lbl{flex:1;font:500 15px var(--sf);color:var(--ink)}
.gsrow .sep{position:absolute;left:47px;right:0;bottom:0;height:1px;background:rgba(199,199,204,.75)}
.qagrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{height:78px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:0 4px;color:var(--accent) !important;min-width:0}
.qa span{color:var(--ink);font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secrow{display:flex;justify-content:space-between;align-items:center}
.viewall{font:400 15px var(--rounded);color:var(--secondary) !important}
.srow{height:56px;width:100%;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;padding:0 16px}
.srow .lbl{flex:1;text-align:left;font:500 15px var(--sf);color:var(--ink)}
.srow b{font:600 15px var(--sf);color:var(--ink);font-variant-numeric:tabular-nums}
.helpbtn{position:absolute;right:20px;padding:15px 22px;border-radius:999px;background:var(--accent);color:#fff !important;font:600 17px/20px var(--sf);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12);z-index:6}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:15px 0 54px;display:flex;z-index:7}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:400 11px var(--sf);color:var(--ink) !important}
.tabbar button.on{color:var(--accent) !important;font-weight:600}
.chips{position:absolute;left:0;right:0;display:flex;gap:8px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--border);font:500 14px var(--sf);color:var(--secondary) !important}
.chip i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pill);display:grid;place-items:center;font:600 12px var(--sf);color:var(--secondary)}
.chip.on{background:rgba(29,82,151,.08);box-shadow:inset 0 0 0 1px rgba(29,82,151,.3);color:var(--accent) !important;font-weight:600}
.chip.on i{background:var(--accent);color:#fff}
.pcard{width:100%;text-align:left;background:#fff;border-radius:14px;box-shadow:0 5px 16px rgba(0,0,0,.08);padding:23px;display:flex;flex-direction:column;gap:8px}
.pcard .num{display:flex;justify-content:space-between;align-items:center;font:400 13px var(--sf);color:var(--secondary)}
.pcard .t{font:600 18px/1.25 var(--sf);color:#000}
.pcard .p{font:700 20px var(--sf);color:#000;padding-bottom:4px;font-variant-numeric:tabular-nums}
.flow{display:flex;flex-wrap:wrap;gap:8px}
.tagp{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--border);font:500 13px var(--sf);color:var(--secondary)}
.asg{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:10px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border);font:500 13px var(--sf);color:var(--secondary)}
.crow{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.crow .av{width:44px;height:44px;border-radius:50%;background:var(--pill);display:grid;place-items:center;font:500 16px var(--sf);color:var(--secondary);flex:none}
.crow .nm{font:600 16px var(--sf);color:#000}
.crow .sm{font:400 13px var(--sf);color:var(--secondary);margin-top:2px}
/* project detail */

  box-shadow:inset 0 1px 0 #fff,0 12px 26px -18px rgba(11,46,90,.35);transition:background .3s,color .3s,transform .34s cubic-bezier(.3,1.8,.45,1)}
.qopt:active{transform:scale(.96)}
.qopt.on{background:linear-gradient(rgba(41,48,69,.95),rgba(20,20,25,.95));transform:scale(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 28px -14px rgba(20,20,25,.5)}
.qopt.on::after{content:"";position:absolute;inset:-2px;border-radius:17px;border:2.5px solid var(--light);pointer-events:none;animation:burst .6s ease-out forwards}
@keyframes burst{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.12);border-width:0}}
.zipfield{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* 100%: the ring pops and throws sparks */
.ring .sparks b{position:absolute;left:50%;top:50%;width:5px;height:13px;margin:-6.5px 0 0 -2.5px;border-radius:3px;background:#fff;opacity:0;transform:rotate(var(--a)) translateY(-60px)}
.ring.done .sparks b{animation:spark 1.15s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-62px) scaleY(1.2)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scaleY(.4)}}
.ring.done svg{animation:ringPop .7s cubic-bezier(.3,1.8,.45,1)}
@keyframes ringPop{0%{transform:rotate(-90deg) scale(1)}35%{transform:rotate(-90deg) scale(1.14)}100%{transform:rotate(-90deg) scale(1)}}
.ring .shock{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.9);opacity:0}
.ring.done .shock{animation:shock 1s ease-out forwards}
@keyframes shock{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.9);border-width:0}}

/* Opening Liquid Glass logo reveal */
.intro{position:absolute;inset:0;z-index:98;background:#0E3667;overflow:clip;transition:opacity .7s ease,transform .7s cubic-bezier(.3,1.2,.5,1);cursor:pointer}
.intro.out{opacity:0;transform:scale(1.12);pointer-events:none}
.intro .word{position:absolute;left:0;right:0;top:calc(50% + 150px);text-align:center;font:700 34px var(--rounded);color:#fff;opacity:0;animation:wordIn .8s cubic-bezier(.3,1.3,.5,1) 2.7s forwards}
@keyframes wordIn{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.intro .skip{position:absolute;right:22px;top:66px;font:600 13px var(--rounded);color:rgba(255,255,255,.7);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.intro canvas{z-index:0}
.intro .word,.intro .skip{z-index:1}

/* Touch / cursor gradient: a round glow (fixed size, even falloff) follows the pointer;
   position, hue and strength are set every frame by the follower script. */
.grad::before{inset:0;animation:none;transform:none;mix-blend-mode:screen;
  background:radial-gradient(circle 260px at var(--gx,50%) var(--gy,45%),hsla(var(--gh,214),85%,66%,calc(var(--ga,0) * .42)) 0%,hsla(var(--gh,214),85%,62%,calc(var(--ga,0) * .26)) 30%,hsla(var(--gh,214),85%,58%,calc(var(--ga,0) * .1)) 58%,transparent 80%)}
.grad.nobg::before{display:none}
.screen[style="background:#fff"]::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle 260px at var(--gx,50%) var(--gy,45%),hsla(var(--gh,214),90%,82%,calc(var(--ga,0) * .55)) 0%,hsla(var(--gh,214),88%,86%,calc(var(--ga,0) * .32)) 30%,hsla(var(--gh,214),85%,90%,calc(var(--ga,0) * .1)) 58%,transparent 80%)}

function startPageAnimations(){

/* cubic-bezier(0.32,0.02,0.18,1) like .timingCurve in the code */
function ease(x){let lo=0,hi=1,t=x;for(let i=0;i<24;i++){t=(lo+hi)/2;const bx=3*(1-t)*(1-t)*t*0.32+3*(1-t)*t*t*0.18+t*t*t;if(bx<x)lo=t;else hi=t}return 3*(1-t)*(1-t)*t*0.02+3*(1-t)*t*t*1+t*t*t}
function on(id){const e=document.getElementById(id);if(e)e.classList.add("on")}
function revealStep(s){ root.querySelectorAll(`.rv[data-step="${s}"]`).forEach(e=>{e.classList.add("on");e.querySelectorAll("[data-count]").forEach(countUp)}); }
function countUp(el){ const v=+el.dataset.count; let st=null; const f=ts=>{if(!st)st=ts;const k=Math.min(1,(ts-st)/520);el.textContent=whole(Math.round(v*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)}; requestAnimationFrame(f); }
function setBuild(v){
  S.build=v; const arc=document.getElementById("arc"); if(!arc) return;
  const c=2*Math.PI*((156-8.5)/2); arc.setAttribute("stroke-dashoffset",c*(1-v/100)); document.getElementById("pct").textContent=v+"%";
  root.querySelectorAll(".checklist [data-at]").forEach(d=>d.classList.toggle("on",v>=+d.dataset.at));
  if(v>=100){ const b=document.getElementById("buildbtn"); b.classList.remove("off"); b.dataset.act="enterApp"; document.querySelector(".ring")?.classList.add("done"); }
}
